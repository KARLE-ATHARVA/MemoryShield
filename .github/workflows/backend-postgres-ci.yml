name: Backend PostgreSQL CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python 3.12 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memoryshield
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: memoryshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoryshield -d memoryshield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://memoryshield:ci_only_password@localhost:5432/memoryshield_test
      TEST_DATABASE_URL: postgresql+psycopg://memoryshield:ci_only_password@localhost:5432/memoryshield_test
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify isolated test database
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          from app.core.config import get_settings
          import os

          url = make_url(get_settings().database_url)
          test_url = make_url(os.environ["TEST_DATABASE_URL"])

          assert url.database == "memoryshield_test"
          assert test_url.database == "memoryshield_test"
          assert url == test_url

          engine = create_engine(url)
          with engine.connect() as connection:
              database = connection.scalar(
                  text("SELECT current_database()")
              )
              assert database == "memoryshield_test", database
              print("Connected to isolated test database")
          engine.dispose()
          PY

      - name: Apply all Alembic migrations
        run: |
          alembic upgrade head
          alembic current --check-heads

      - name: Verify security audit and evidence triggers
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_settings

          engine = create_engine(get_settings().database_url)

          with engine.connect() as connection:
              audit_exists = connection.scalar(
                  text(
                      "SELECT to_regclass('public.memory_security_audit')"
                  )
              )

              count = connection.scalar(
                  text("""
                      SELECT count(*)
                      FROM pg_trigger
                      WHERE NOT tgisinternal
                        AND tgname LIKE 'trg_%_immutable'
                  """)
              )

          engine.dispose()

          assert audit_exists is not None, "Security audit table missing"
          assert count == 8, f"Expected 8 immutable triggers, got {count}"

          print("Security audit table and all 8 triggers verified")
          PY

      - name: Ruff lint
        run: |
          ruff check app tests

      - name: Python compilation
        run: |
          python -m compileall -q app migrations tests

      - name: Complete PostgreSQL regression suite
        run: |
          python -m pytest tests/ -q
