services:
  postgres:
    image: postgres:16-alpine
    container_name: memoryshield-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: memoryshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: memoryshield

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - memoryshield_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryshield -d memoryshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memoryshield_pgdata: